<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>민감 정보 가리기</title>
  <style>
    :root { color-scheme: light; --ink:#172033; --muted:#697386; --line:#dbe2ec; --primary:#315efb; --soft:#f5f7fb; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; font-family:system-ui,-apple-system,"Segoe UI","Noto Sans KR",sans-serif; color:var(--ink); background:linear-gradient(145deg,#eef3ff,#fff 45%,#f8fafc); }
    main { width:min(920px,calc(100% - 32px)); margin:0 auto; padding:48px 0 64px; }
    header { margin-bottom:28px; }
    h1 { margin:0 0 10px; font-size:clamp(28px,5vw,42px); letter-spacing:-.05em; }
    header p { margin:0; color:var(--muted); }
    .card { background:#fff; border:1px solid rgba(219,226,236,.9); border-radius:20px; padding:24px; box-shadow:0 12px 36px rgba(44,64,104,.08); }
    label { display:block; margin:0 0 9px; font-weight:750; }
    textarea, input { width:100%; border:1px solid var(--line); border-radius:12px; padding:14px 15px; font:inherit; color:var(--ink); background:#fff; outline:none; transition:.2s; }
    textarea:focus, input:focus { border-color:var(--primary); box-shadow:0 0 0 4px rgba(49,94,251,.12); }
    #source { min-height:230px; resize:vertical; line-height:1.65; }
    .field { margin-bottom:20px; }
    .hint { margin:8px 0 0; color:var(--muted); font-size:13px; }
    button { border:0; border-radius:11px; padding:12px 18px; font:inherit; font-weight:750; cursor:pointer; }
    #maskBtn { color:#fff; background:var(--primary); box-shadow:0 6px 14px rgba(49,94,251,.22); }
    #maskBtn:hover { filter:brightness(.94); }
    .option { display:flex; align-items:center; gap:8px; margin:-4px 0 18px; font-weight:650; cursor:pointer; }
    .option input { width:17px; height:17px; accent-color:var(--primary); }
    .option span { color:var(--muted); font-size:13px; font-weight:400; }
    #resultArea { display:none; margin-top:24px; }
    .result-head { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:9px; }
    .result-head label { margin:0; }
    #copyBtn { color:var(--primary); background:#edf1ff; padding:9px 14px; }
    #result { min-height:180px; white-space:pre-wrap; word-break:break-word; background:var(--soft); line-height:1.65; }
    #summary { display:flex; flex-wrap:wrap; gap:8px; margin-top:16px; }
    .badge { padding:8px 11px; border-radius:999px; background:#edf1ff; color:#2748b8; font-size:14px; }
    .empty { color:var(--muted); background:#f8fafc; }
    .privacy { margin-top:16px; font-size:13px; color:var(--muted); text-align:center; }
    @media (max-width:560px) { main { padding-top:28px; } .card { padding:18px; border-radius:16px; } .result-head { align-items:flex-start; } }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>민감 정보 가리기</h1>
      <p>텍스트 속 거래처명, 이름, 연락처와 식별번호를 브라우저 안에서 안전하게 가립니다.</p>
    </header>
    <section class="card">
      <div class="field">
        <label for="source">원문</label>
        <textarea id="source" placeholder="가릴 원문을 붙여넣으세요."></textarea>
      </div>
      <div class="field">
        <label for="words">가릴 단어 목록</label>
        <input id="words" value="새론하우징, 대성종합설비, 청솔에너지, 김서연" aria-describedby="wordHint">
        <p id="wordHint" class="hint">쉼표(,)로 여러 단어를 구분합니다. 이메일·전화번호·사업자등록번호도 자동으로 찾습니다.</p>
      </div>
      <label class="option"><input id="maskAmounts" type="checkbox"> 금액도 가리기 <span>(예: 1,650,000원)</span></label>
      <button id="maskBtn" type="button">가리기</button>

      <div id="resultArea">
        <div class="result-head"><label for="result">가린 결과</label><button id="copyBtn" type="button">복사</button></div>
        <div id="result" role="textbox" aria-readonly="true" tabindex="0"></div>
        <div id="summary" aria-live="polite"></div>
      </div>
    </section>
    <p class="privacy">🔒 입력한 내용은 인터넷으로 전송되지 않으며, 이 브라우저 안에서만 처리됩니다.</p>
  </main>
  <script>
    const source = document.querySelector('#source');
    const wordsInput = document.querySelector('#words');
    const resultArea = document.querySelector('#resultArea');
    const result = document.querySelector('#result');
    const summary = document.querySelector('#summary');
    const mask = '███';

    const escapeRegExp = value => value.replace(/[.*+?^${}()|[\[\]\\]/g, '\\$&');
    function maskText() {
      const customWords = [...new Set(wordsInput.value.split(',').map(v => v.trim()).filter(Boolean))];
      const maskAmounts = document.querySelector('#maskAmounts').checked;
      const patterns = [
        { key:'이메일', re:'[A-Z0-9._%+-]+@[A-Z0-9.-]+\\.[A-Z]{2,}', flags:'gi' },
        { key:'전화번호', re:'(?:0\\d{1,2}[- .)]?\\d{3,4}[- .]?\\d{4}|01[016789][- .]?\\d{3,4}[- .]?\\d{4})', flags:'g' },
        { key:'사업자등록번호', re:'\\b\\d{3}[- .]?\\d{2}[- .]?\\d{5}\\b', flags:'g' }
      ];
      if (maskAmounts) patterns.push({ key:'금액', re:'\\b\\d{1,3}(?:,\\d{3})+원|\\b\\d+원', flags:'g' });
      customWords.forEach(word => patterns.push({ key:word, re:escapeRegExp(word), flags:'g' }));
      const counts = Object.fromEntries(patterns.map(p => [p.key, 0]));
      // 하나의 통합 정규식으로 원문을 한 번만 훑어, 항목이 겹쳐도 중복 마스킹하지 않습니다.
      const combined = new RegExp(patterns.map(p => '(' + p.re + ')').join('|'), 'gi');
      const text = source.value;
      const masked = text.replace(combined, match => {
        const found = patterns.find(p => new RegExp('^' + p.re + '$', p.flags.replace('g','')).test(match));
        if (found) counts[found.key]++;
        return mask;
      });
      result.textContent = masked;
      summary.innerHTML = '';
      const entries = Object.entries(counts).filter(([, count]) => count > 0);
      if (!entries.length) summary.innerHTML = '<span class="badge empty">가려진 항목이 없습니다</span>';
      entries.forEach(([key, count]) => { const badge = document.createElement('span'); badge.className='badge'; badge.textContent = key + ' ' + count + '건'; summary.appendChild(badge); });
      resultArea.style.display = 'block';
    }
    document.querySelector('#maskBtn').addEventListener('click', maskText);
    document.querySelector('#copyBtn').addEventListener('click', async () => {
      try { await navigator.clipboard.writeText(result.textContent); document.querySelector('#copyBtn').textContent='복사됨'; setTimeout(() => document.querySelector('#copyBtn').textContent='복사', 1200); }
      catch { alert('복사할 수 없습니다. 결과를 직접 선택해 복사해 주세요.'); }
    });
  </script>
</body>
</html>
